name: CI

on:
  push:
    branches: [main, "oscar/o/**"]
  pull_request:

concurrency:
  # Cancel superseded pull request runs, but never interrupt a production
  # deploy, so deploys on `main` stay in order.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Start from no permissions and grant the minimum each job needs.
permissions: {}

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail on lint diagnostics before spending time on the build.
      - run: pnpm lint

      # `cf workers types` regenerates the binding types the checks build on.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Validate the exact Build Output that the deploy job publishes.
      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # Deploys are built from this output. Pull requests never deploy, so skip
      # their upload.
      - name: Upload build output
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: .cloudflare/output/v1
          include-hidden-files: true
          # Allow re-running a failed workflow with the same artifact name.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Deploying existing Build Output only needs the `cf` binary and the
      # configuration, so skip the install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: .cloudflare/output/v1

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm exec cf deploy --prebuilt --mode production --message "Deploy ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for url in "https://eryn.otbeaumont.me/"; do
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --output /dev/null "$url"
            echo "OK $url"
          done

      # `cf deploy` switches traffic before the smoke test runs, so a failed
      # probe leaves the new version live. `cf` has no rollback command, so
      # create a deployment for the previous version instead. Durable Object
      # migrations can make that impossible; the step is best effort and the
      # failed deploy still fails the job.
      - name: Roll back if the smoke test fails
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The deployment that failed the probe is the newest one, so the
          # version before it is the one that was live beforehand.
          previous="$(pnpm exec cf workers deployments list --worker eryn --per-page 2 | jq -er '[.deployments[].versions[0].version_id][1]')"
          pnpm exec cf workers deployments create \
            --worker eryn \
            --strategy percentage \
            --versions "[{\"version_id\":\"$previous\",\"percentage\":100}]"
